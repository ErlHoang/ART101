<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A and B</title>

    <link rel="stylesheet" href="talking.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="talking.js" defer></script>
</head>

<body>

    <p id="turn-message">Click A to begin.</p>

    <div id="scene">

        <div class="character" id="panel-a">
            <h2>Jungle Pocket</h2>
            <img id="character-a" src="jungle-pocket.png" alt="Character A">
        </div>

        <div class="character" id="panel-b">
            <h2>Agnes Tachyon</h2>
            <img id="character-b" src="agnes-tachyon.png" alt="Character B">
        </div>

    </div>

    <div id="chat"></div>

    <div id="answers">
        <button id="answer-green" type="button">Green</button>
        <button id="answer-pink" type="button">Pink</button>
    </div>
</body>
</html>
